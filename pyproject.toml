[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "mcp-data-analysis-agent"
version = "0.1.0"
description = "Local, governed analytics tools for MCP clients"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "MCP Data Analysis Agent contributors" }]
dependencies = [
  "mcp>=1.12,<2",
  "pydantic>=2.8,<3",
  "psycopg[binary,pool]>=3.2,<4",
  "sqlalchemy>=2.0,<3",
  "python-dotenv>=1.0,<2",
  "sqlglot>=25,<29",
  "typer>=0.12,<1",
]

[project.optional-dependencies]
parquet = ["pyarrow>=17,<20"]
dev = ["pytest>=8,<9", "pytest-cov>=5,<7", "ruff>=0.6,<1", "mypy>=1.11,<2"]

[project.scripts]
mcp-data-cli = "mcp_data_agent.cli:app"
mcp-data-mcp = "mcp_data_agent.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_data_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["benchmark: deterministic end-to-end performance evidence"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
