# Version-controlled approved semantic definitions.
[[metric]]
name = "revenue"
description = "Sum of recognized order-item revenue."
classification = "internal"
owner = "analytics"
source_alias = "retail"
sql = "SELECT SUM(order_items.revenue) AS revenue FROM order_items"

[[metric]]
name = "mrr"
description = "Sum of active subscription monthly recurring revenue."
classification = "internal"
owner = "analytics"
source_alias = "saas"
sql = "SELECT SUM(subscriptions.mrr) AS mrr FROM subscriptions WHERE subscriptions.status = 'active'"
